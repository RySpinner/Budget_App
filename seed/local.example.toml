# Copy this file to seed/local.toml (which is gitignored) and fill in real
# values. It holds personal details, so it stays out of git.
#
#   cp seed/local.example.toml seed/local.toml      (Windows: copy seed\local.example.toml seed\local.toml)
#   python -m budget.seed
#
# A "Joint" person and a "Cash" account are created automatically.

[[person]]
name = "Partner A"

[[person]]
name = "Partner B"

# One entry per account. Only the last 4 digits, never the full number.
#   type:       credit_card, checking or savings (also cash; brokerage /
#               retirement / loan are reserved for later)
#   owner:      a person above, or "Joint" for joint accounts
#   parser_key: which parser reads this account's CSV export.
#               Available: "citi", "chase", "credit_union". Bank parsers come in phase 9.
#               Leave it out for an account you only enter by hand.
[[account]]
display_name = "Partner A - Citi card"
institution = "Citi"
type = "credit_card"
last4 = "0000"
owner = "Partner A"
parser_key = "citi"

[[account]]
display_name = "Partner B - Chase card"
institution = "Chase"
type = "credit_card"
last4 = "1111"
owner = "Partner B"
parser_key = "chase"

[[account]]
display_name = "Joint checking"
institution = "Example Bank"
type = "checking"
last4 = "2222"
owner = "Joint"

# Older files with [[card]] entries (display_name, issuer, last4, owner,
# parser_key) still work; they're treated as credit cards.
